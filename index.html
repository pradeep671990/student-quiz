<!DOCTYPE html>
<html>

<head>

  <title>Class 5 Quiz</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="quiz-container">

  <h1>
    Class 5 Quiz Portal
  </h1>


  <!-- =========================
       QUIZ CONTROLS
  ========================== -->

  <div class="controls">


    <!-- Student Name -->

    <label>
      Student Name:
    </label>

    <input
      type="text"
      id="studentName"
      placeholder="Enter your name"
    >


    <!-- Category Selection -->

    <label>
      Select Category:
    </label>

    <select id="categorySelect">

      <option value="All">
        All Categories
      </option>

      <option value="GK">
        GK
      </option>

      <option value="Computer">
        Computer
      </option>

      <option value="Science">
        Science
      </option>

      <option value="Maths">
        Maths
      </option>

      <option value="Games & Sports">
        Games & Sports
      </option>

    </select>


    <!-- Question Count -->

    <label>
      Select Number of Questions:
    </label>

    <select id="questionLimit">

      <option value="10">
        10 Questions
      </option>

      <option value="20">
        20 Questions
      </option>

      <option value="30">
        30 Questions
      </option>

      <option value="40">
        40 Questions
      </option>

      <option value="50">
        50 Questions
      </option>

    </select>


    <!-- Start Button -->

    <button onclick="startQuiz()">

      Start Quiz

    </button>

  </div>


  <!-- =========================
       TIMER + QUESTION COUNT
  ========================== -->

  <div class="top-bar">

    <div id="timer">

      Time Left: 10:00

    </div>

    <div id="questionCount">

    </div>

  </div>


  <!-- =========================
       QUIZ QUESTIONS
  ========================== -->

  <div id="quiz">

  </div>


  <!-- =========================
       SUBMIT BUTTON
  ========================== -->

  <button onclick="submitQuiz()">

    Submit Quiz

  </button>


  <!-- =========================
       RESULT SECTION
  ========================== -->

  <div id="result">

  </div>


  <!-- =========================
       QUIZ HISTORY
  ========================== -->

  <hr>

  <h2>
    Quiz History
  </h2>

  <div id="history">

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
